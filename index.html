<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tes Sistem CyberCrypt</title>
  <style>
    body { background: #0b0f19; color: #fff; font-family: sans-serif; text-align: center; padding: 40px 20px; }
    .card { background: #121826; border: 1px solid #333; padding: 20px; border-radius: 12px; max-width: 400px; margin: 0 auto; }
    button { background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: bold; width: 100%; margin-top: 10px; cursor: pointer; }
    #status-box { background: #1e293b; padding: 10px; border-radius: 6px; margin-top: 15px; font-size: 0.85rem; color: #94a3b8; }
  </style>
</head>
<body>

<div class="card">
  <h2>🔒 Tes Diagnosa Web</h2>
  <div id="status-box">Menjalankan tes...</div>
  <button id="btn-test">Klik Tes Respon</button>
</div>

<script>
  document.addEventListener("DOMContentLoaded", async () => {
    const statusBox = document.getElementById("status-box");
    const btn = document.getElementById("btn-test");

    // Pengecekan Fitur Browser
    let info = "";
    if (window.location.protocol !== 'https:' && window.location.hostname !== 'localhost') {
      info += "⚠️ Wajib gunakan HTTPS!<br>";
    } else {
      info += "✅ Protokol HTTPS Aktif.<br>";
    }

    if (window.crypto && window.crypto.subtle) {
      info += "✅ Fitur Enkripsi (Crypto) Siap.<br>";
    } else {
      info += "❌ Fitur Enkripsi DIBLOKIR browser.<br>";
    }

    statusBox.innerHTML = info;

    btn.addEventListener("click", () => {
      alert("Tombol Berhasil Merespon!");
    });
  });
</script>

</body>
</html>
