<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberCrypt - Private Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0b1329; color: #fff; display: flex; justify-content: center; padding: 10px; }
        .app-container { width: 100%; max-width: 450px; background: #172036; border-radius: 12px; height: 95vh; display: flex; flex-direction: column; overflow: hidden; border: 1px solid #23304d; }
        .header { padding: 14px; background: #0d1527; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #23304d; }
        .setup-panel { padding: 15px; background: #10192d; display: flex; flex-direction: column; gap: 8px; font-size: 0.85rem; }
        .setup-panel input { padding: 8px; border-radius: 6px; border: 1px solid #2d3d5f; background: #0d1527; color: #fff; }
        .chat-box { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #0b1329; }
        .msg { padding: 10px; border-radius: 8px; max-width: 80%; font-size: 0.9rem; word-break: break-word; }
        .sent { background: #2563eb; align-self: flex-end; }
        .received { background: #23304d; align-self: flex-start; }
        .msg img, .msg video { max-width: 100%; border-radius: 6px; margin-top: 5px; }
        .input-bar { padding: 10px; background: #0d1527; display: flex; gap: 6px; align-items: center; border-top: 1px solid #23304d; }
        .input-bar input[type="text"] { flex: 1; padding: 10px; border-radius: 20px; border: 1px solid #2d3d5f; background: #172036; color: #fff; }
        .btn-action { background: #23304d; border: none; color: #fff; padding: 8px 10px; border-radius: 50%; cursor: pointer; font-size: 1rem; }
        .btn-send { background: #2563eb; border: none; color: #fff; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .recording { background: #ef4444 !important; animation: pulse 1s infinite; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <strong style="color:#38bdf8;">🔒 CyberCrypt Chat</strong>
        <span id="syncStatus" style="font-size: 0.8rem; color:#10b981;">● Siap</span>
    </div>

    <div class="setup-panel">
        <input type="text" id="backendUrl" placeholder="URL Backend Railway (https://...up.railway.app)">
        <div style="display: flex; gap: 8px;">
            <input type="text" id="myId" placeholder="ID Anda" style="width: 50%;">
            <input type="text" id="targetId" placeholder="ID Tujuan" style="width: 50%;">
        </div>
        <button onclick="startChat()" style="padding: 8px; background: #2563eb; color:#fff; border:none; border-radius: 6px; font-weight:bold; cursor:pointer;">Buka Obrolan</button>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <!-- Panel Input Chat & Fitur Media -->
    <div class="input-bar" id="inputArea" style="display: none;">
        <!-- Foto / Kamera / Galeri / Video -->
        <label class="btn-action" title="Kirim Foto/Video">
            📁
            <input type="file" id="fileInput" accept="image/*,video/*" style="display: none;" onchange="uploadMedia(this.files[0])">
        </label>
        
        <!-- Bagikan Lokasi Map -->
        <button class="btn-action" title="Bagikan Lokasi" onclick="shareLocation()">📍</button>

        <!-- Record Voice Note -->
        <button class="btn-action" id="vnBtn" title="Tahan/Klik untuk Rekam VN" onclick="toggleVN()">🎙️</button>

        <input type="text" id="textInput" placeholder="Tulis pesan..." onkeydown="if(event.key==='Enter') sendText()">
        <button class="btn-send" onclick="sendText()">Kirim</button>
    </div>
</div>

<script>
    let SERVER_URL = "";
    let MY_ID = "";
    let TARGET_ID = "";
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    function startChat() {
        SERVER_URL = document.getElementById("backendUrl").value.trim().replace(/\/$/, "");
        MY_ID = document.getElementById("myId").value.trim();
        TARGET_ID = document.getElementById("targetId").value.trim();

        if (!SERVER_URL || !MY_ID || !TARGET_ID) {
            alert("Isi URL Backend, ID Anda, dan ID Tujuan!");
            return;
        }

        document.getElementById("inputArea").style.display = "flex";
        loadMessages();
        // Cek riwayat pesan baru setiap 3 detik (Mendukung offline/asinkron)
        setInterval(loadMessages, 3000);
    }

    async function loadMessages() {
        try {
            const res = await fetch(`${SERVER_URL}/messages/${MY_ID}/${TARGET_ID}`);
            const data = await res.json();
            const box = document.getElementById("chatBox");
            box.innerHTML = "";

            data.forEach(msg => {
                const isMe = msg.sender_id === MY_ID;
                const div = document.createElement("div");
                div.className = `msg ${isMe ? 'sent' : 'received'}`;

                if (msg.msg_type === 'text') {
                    div.innerText = msg.content;
                } else if (msg.msg_type === 'image') {
                    div.innerHTML = `<img src="${SERVER_URL}${msg.content}">`;
                } else if (msg.msg_type === 'video') {
                    div.innerHTML = `<video src="${SERVER_URL}${msg.content}" controls></video>`;
                } else if (msg.msg_type === 'audio') {
                    div.innerHTML = `<audio src="${SERVER_URL}${msg.content}" controls></audio>`;
                } else if (msg.msg_type === 'location') {
                    const [lat, lon] = msg.content.split(",");
                    div.innerHTML = `📍 <a href="https://www.google.com/maps?q=${lat},${lon}" target="_blank" style="color:#38bdf8;">Buka Lokasi di Map</a>`;
                }
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
        } catch (e) {
            document.getElementById("syncStatus").innerText = "🔴 Gagal Sync";
        }
    }

    async function sendPayload(type, content) {
        await fetch(`${SERVER_URL}/messages`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sender_id: MY_ID, receiver_id: TARGET_ID, msg_type: type, content: content })
        });
        loadMessages();
    }

    function sendText() {
        const input = document.getElementById("textInput");
        if (input.value.trim()) {
            sendPayload("text", input.value.trim());
            input.value = "";
        }
    }

    async function uploadMedia(file) {
        if (!file) return;
        const formData = new FormData();
        formData.append("file", file);

        const res = await fetch(`${SERVER_URL}/upload`, { method: "POST", body: formData });
        const data = await res.json();
        const type = file.type.startsWith("video/") ? "video" : file.type.startsWith("audio/") ? "audio" : "image";
        sendPayload(type, data.url);
    }

    function shareLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                const coords = `${pos.coords.latitude},${pos.coords.longitude}`;
                sendPayload("location", coords);
            }, () => alert("Gagal mengambil lokasi. Pastikan izin lokasi aktif!"));
        }
    }

    async function toggleVN() {
        const vnBtn = document.getElementById("vnBtn");
        if (!isRecording) {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = async () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                const file = new File([blob], "vn.webm", { type: "audio/webm" });
                uploadMedia(file);
            };
            mediaRecorder.start();
            isRecording = true;
            vnBtn.classList.add("recording");
        } else {
            mediaRecorder.stop();
            isRecording = false;
            vnBtn.classList.remove("recording");
        }
    }
</script>

</body>
</html>
