<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER_CRYPT // E2EE TERMINAL</title>
  <!-- Google Fonts: Inter & Orbitron -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #070b12 0%, #0d1527 100%);
      --card-bg: rgba(13, 22, 38, 0.75);
      --accent-cyan: #00f0ff;
      --accent-green: #00ff88;
      --accent-red: #ff3366;
      --accent-orange: #ff9900;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --border-color: rgba(0, 240, 255, 0.15);
      --border-focus: rgba(0, 240, 255, 0.6);
      --input-bg: rgba(5, 10, 18, 0.8);
    }

    * {
      box-sizing: border-box;
      transition: all 0.2s ease-in-out;
    }

    body { 
      font-family: 'Inter', system-ui, -apple-system, sans-serif; 
      background: var(--bg-gradient); 
      color: var(--text-main); 
      margin: 0; 
      padding: 20px 15px; 
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card { 
      width: 100%;
      max-width: 480px; 
      background: var(--card-bg); 
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 24px; 
      border-radius: 16px; 
      border: 1px solid var(--border-color); 
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 20px rgba(0, 240, 255, 0.05); 
    }

    .header-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--accent-cyan);
      letter-spacing: 1.5px;
      text-align: center;
      margin: 0 0 15px 0;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .system-status {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 20px;
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      font-weight: 500;
    }

    /* Grid Input ID */
    .id-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .input-group label {
      display: block;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    input[type="text"] { 
      width: 100%; 
      padding: 10px 14px; 
      border-radius: 8px; 
      border: 1px solid var(--border-color); 
      background: var(--input-bg); 
      color: var(--text-main); 
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
    }

    button { 
      width: 100%; 
      padding: 11px 16px; 
      border-radius: 8px; 
      border: 1px solid var(--border-color); 
      background: rgba(0, 240, 255, 0.08); 
      color: var(--accent-cyan);
      font-family: 'Inter', sans-serif;
      font-weight: 600; 
      font-size: 0.82rem;
      cursor: pointer; 
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    button:hover { 
      background: var(--accent-cyan); 
      color: #050a12; 
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }

    .btn-connect {
      background: linear-gradient(90deg, rgba(0, 240, 255, 0.15) 0%, rgba(0, 255, 136, 0.15) 100%);
      border-color: var(--accent-cyan);
      color: #fff;
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 0.5px;
    }

    /* Area Chat */
    #chat-box { 
      height: 280px; 
      border: 1px solid var(--border-color); 
      overflow-y: auto; 
      padding: 12px; 
      margin: 15px 0; 
      border-radius: 10px; 
      background: rgba(3, 7, 13, 0.6); 
      display: flex; 
      flex-direction: column; 
      gap: 10px;
    }

    /* Scrollbar */
    #chat-box::-webkit-scrollbar { width: 5px; }
    #chat-box::-webkit-scrollbar-thumb { background: rgba(0, 240, 255, 0.2); border-radius: 10px; }

    .msg { 
      padding: 10px 14px; 
      border-radius: 10px; 
      max-width: 82%; 
      word-break: break-word; 
      font-size: 0.85rem; 
      line-height: 1.45;
    }

    .msg-sender {
      font-size: 0.7rem;
      font-weight: 700;
      margin-bottom: 4px;
      opacity: 0.8;
      text-transform: uppercase;
    }

    .system { 
      color: var(--text-muted); 
      text-align: center; 
      font-size: 0.72rem; 
      margin: 2px 0; 
      font-style: italic;
    }

    .in { 
      background: rgba(0, 255, 136, 0.08); 
      border: 1px solid rgba(0, 255, 136, 0.2);
      color: var(--text-main);
      align-self: flex-start; 
      border-bottom-left-radius: 2px;
    }

    .in .msg-sender { color: var(--accent-green); }

    .out { 
      background: rgba(0, 240, 255, 0.1); 
      border: 1px solid rgba(0, 240, 255, 0.25);
      color: var(--text-main);
      margin-left: auto; 
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .out .msg-sender { color: var(--accent-cyan); text-align: right; }

    .media-preview { 
      max-width: 100%; 
      border-radius: 8px; 
      margin-top: 6px; 
      border: 1px solid var(--border-color);
    }

    /* Input Kirim Pesan */
    .send-box {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .send-box input {
      flex: 1;
    }

    .send-box button {
      width: auto;
      padding: 0 18px;
    }

    /* Grid Action Tools */
    .tools-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .tools-grid button {
      font-size: 0.75rem;
      padding: 9px;
    }

    .btn-camera { border-color: rgba(0, 240, 255, 0.3); color: var(--accent-cyan); }
    .btn-gps { border-color: rgba(0, 255, 136, 0.3); color: var(--accent-green); }
    .btn-file { border-color: rgba(255, 255, 255, 0.15); color: var(--text-main); }
    .btn-audio { border-color: rgba(255, 153, 0, 0.3); color: var(--accent-orange); }
    .btn-purge { grid-column: span 2; border-color: rgba(255, 51, 102, 0.3); color: var(--accent-red); margin-top: 4px; }

    /* Modul Kamera Visual */
    #camera-panel {
      display: none;
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid var(--accent-cyan);
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 10px;
      text-align: center;
    }

    #video-feed {
      width: 100%;
      max-height: 200px;
      border-radius: 6px;
      background: #000;
      object-fit: cover;
    }

    .cam-btn-group {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }

    a.map-link {
      color: var(--accent-cyan);
      font-weight: 600;
      text-decoration: underline;
    }

    /* Custom File Input Hide */
    input[type="file"] { display: none; }
  </style>
</head>
<body>

<div class="card">
  <div class="header-title">⚡ CYBER_CRYPT</div>
  <div id="status" class="system-status">Generating 2048-bit RSA keypair...</div>
  
  <div class="id-grid">
    <div class="input-group">
      <label>ID Anda</label>
      <input type="text" id="my-id" placeholder="node_alpha">
    </div>
    <div class="input-group">
      <label>ID Tujuan</label>
      <input type="text" id="target-id" placeholder="node_bravo">
    </div>
  </div>
  
  <button onclick="connectWS()" class="btn-connect">🔗 ESTABLISH SECURE LINK</button>

  <div id="chat-box"></div>

  <!-- PANEL KAMERA VISUAL -->
  <div id="camera-panel">
    <video id="video-feed" autoplay playsinline muted></video>
    <div class="cam-btn-group">
      <button onclick="switchCamera()" style="border-color: var(--text-muted); color: var(--text-muted);">🔄 Switch</button>
      <button onclick="captureCameraPhoto()" style="border-color: var(--accent-cyan); color: var(--accent-cyan);">📸 Foto</button>
      <button id="btn-video-rec" onclick="toggleVideoRecording()" style="border-color: var(--accent-red); color: var(--accent-red);">🎥 Rec Video</button>
    </div>
    <button onclick="closeCamera()" style="border-color: var(--accent-red); color: var(--accent-red); margin-top:6px; width:100%;">✕ Tutup Kamera</button>
  </div>

  <div class="send-box">
    <input type="text" id="message-input" placeholder="Tulis disini...">
    <button onclick="sendTextMessage()">Kirim</button>
  </div>
  
  <div class="tools-grid">
    <button onclick="openCamera()" class="btn-camera">📷 Kamera</button>
    <button onclick="sendGPSLocation()" class="btn-gps">📍 Kirim GPS</button>
    
    <button onclick="document.getElementById('media-file').click()" class="btn-file">📁 Upload File</button>
    <input type="file" id="media-file" accept="image/*,video/*,audio/*" onchange="sendMediaFile()">
    
    <button id="btn-vn" onclick="toggleRecording()" class="btn-audio">🎙️ Rekam Audio</button>
    
    <button onclick="clearHistory()" class="btn-purge">🗑️ Hapus Log Lokal</button>
  </div>
</div>

<script>
  const RENDER_WS_URL = "wss://chat-e2ee-backend.onrender.com/ws/"; 
  const CLOUD_NAME = "ktbbdjrb"; 
  const UPLOAD_PRESET = "chat_preset"; 

  let ws, keyPair, peerPublicKey;
  let mediaRecorder, audioChunks = [];
  let videoRecorder, videoChunks = [];
  let cameraStream = null;
  let currentFacingMode = "environment";

  window.onload = () => {
    const savedChat = localStorage.getItem("e2ee_chat_history");
    if (savedChat) {
      document.getElementById("chat-box").innerHTML = savedChat;
      const box = document.getElementById("chat-box");
      box.scrollTop = box.scrollHeight;
    }
  };

  function saveChatToLocal() {
    const boxHtml = document.getElementById("chat-box").innerHTML;
    localStorage.setItem("e2ee_chat_history", boxHtml);
  }

  function clearHistory() {
    if(confirm("Hapus semua log percakapan terenkripsi di perangkat ini?")) {
      localStorage.removeItem("e2ee_chat_history");
      document.getElementById("chat-box").innerHTML = "";
    }
  }

  async function initKeys() {
    keyPair = await window.crypto.subtle.generateKey(
      { name: "RSA-OAEP", modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: "SHA-256" },
      true, ["encrypt", "decrypt"]
    );
    document.getElementById("status").innerText = "🔒 RSA 2048-bit Key Ready";
  }
  initKeys();

  async function exportPublicKey() {
    const exported = await window.crypto.subtle.exportKey("spki", keyPair.publicKey);
    return btoa(String.fromCharCode(...new Uint8Array(exported)));
  }

  async function importPublicKey(pemBase64) {
    const binaryDer = Uint8Array.from(atob(pemBase64), c => c.charCodeAt(0));
    return await window.crypto.subtle.importKey(
      "spki", binaryDer, { name: "RSA-OAEP", hash: "SHA-256" }, true, ["encrypt"]
    );
  }

  async function generateAesKey() {
    return await window.crypto.subtle.generateKey(
      { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]
    );
  }

  async function connectWS() {
    const myId = document.getElementById("my-id").value.trim();
    const targetId = document.getElementById("target-id").value.trim();
    if(!myId || !targetId) return alert("Harap isi ID Anda dan ID Tujuan!");

    document.getElementById("status").innerText = "Connecting to relay server...";
    ws = new WebSocket(RENDER_WS_URL + myId);

    ws.onopen = async () => {
      document.getElementById("status").innerText = "Exchanging encryption keys...";
      const pubKeyStr = await exportPublicKey();
      ws.send(JSON.stringify({ type: "key_exchange", from: myId, to: targetId, key: pubKeyStr }));
    };

    ws.onerror = () => {
      document.getElementById("status").innerText = "⚠️ Connection Failed";
      alert("Gagal terhubung ke server backend.");
    };

    ws.onmessage = async (event) => {
      const data = JSON.parse(event.data);

      if(data.type === "key_exchange") {
        peerPublicKey = await importPublicKey(data.key);
        logSystem(`Public Key diterima dari [${data.from}]`);
        const pubKeyStr = await exportPublicKey();
        ws.send(JSON.stringify({ type: "key_ack", from: myId, to: data.from, key: pubKeyStr }));
      } 
      else if(data.type === "key_ack") {
        peerPublicKey = await importPublicKey(data.key);
        document.getElementById("status").innerText = "🟢 E2EE Channel Active & Encrypted";
        logSystem("Koneksi Aman E2EE Terhubung!");
      }
      else if(data.type === "chat_text") {
        const text = await decryptRSA(data.ciphertext);
        appendMsg(data.from, text, "in");
      }
      else if(data.type === "chat_media") {
        await handleReceivedMedia(data);
      }
    };
  }

  async function sendTextMessage() {
    const text = document.getElementById("message-input").value;
    if(!text) return;
    await transmitEncryptedText(text);
    document.getElementById("message-input").value = "";
  }

  async function transmitEncryptedText(text) {
    const targetId = document.getElementById("target-id").value.trim();
    const myId = document.getElementById("my-id").value.trim();

    if(!peerPublicKey) return alert("Public Key belum tersedia. Hubungkan chat dulu!");

    const enc = new TextEncoder();
    const encrypted = await window.crypto.subtle.encrypt({ name: "RSA-OAEP" }, peerPublicKey, enc.encode(text));
    const ciphertextBase64 = btoa(String.fromCharCode(...new Uint8Array(encrypted)));

    ws.send(JSON.stringify({ type: "chat_text", from: myId, to: targetId, ciphertext: ciphertextBase64 }));
    appendMsg("Saya", text, "out");
  }

  async function openCamera() {
    try {
      if (cameraStream) closeCamera();
      cameraStream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: currentFacingMode }, 
        audio: true 
      });
      document.getElementById("video-feed").srcObject = cameraStream;
      document.getElementById("camera-panel").style.display = "block";
    } catch (err) {
      alert("Akses kamera ditolak atau tidak didukung.");
    }
  }

  function switchCamera() {
    currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
    openCamera();
  }

  function closeCamera() {
    if (cameraStream) {
      cameraStream.getTracks().forEach(track => track.stop());
    }
    document.getElementById("camera-panel").style.display = "none";
  }

  async function captureCameraPhoto() {
    if(!peerPublicKey) return alert("Public Key belum tersedia. Hubungkan chat dulu!");

    const video = document.getElementById("video-feed");
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    canvas.toBlob(async (blob) => {
      const arrayBuffer = await blob.arrayBuffer();
      closeCamera();
      await processAndSendMedia(arrayBuffer, "image/jpeg");
    }, "image/jpeg");
  }

  async function toggleVideoRecording() {
    const btn = document.getElementById("btn-video-rec");

    if (!videoRecorder || videoRecorder.state === "inactive") {
      videoChunks = [];
      videoRecorder = new MediaRecorder(cameraStream);
      
      videoRecorder.ondataavailable = e => videoChunks.push(e.data);
      videoRecorder.onstop = async () => {
        const videoBlob = new Blob(videoChunks, { type: 'video/mp4' });
        const arrayBuffer = await videoBlob.arrayBuffer();
        closeCamera();
        await processAndSendMedia(arrayBuffer, "video/mp4");
      };

      videoRecorder.start();
      btn.innerText = "🛑 Stop & Kirim";
      btn.style.background = "#ff3366";
      btn.style.color = "#fff";
    } else {
      videoRecorder.stop();
      btn.innerText = "🎥 Rec Video";
      btn.style.background = "transparent";
      btn.style.color = "var(--accent-red)";
    }
  }

  function sendGPSLocation() {
    if (!navigator.geolocation) {
      return alert("Fitur GPS tidak didukung browser ini.");
    }

    logSystem("Mengambil koordinat lokasi GPS...");
    
    navigator.geolocation.getCurrentPosition(async (position) => {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      const accuracy = position.coords.accuracy.toFixed(1);
      
      const gpsMessage = `📍 Lokasi GPS Saya:\nLat: ${lat}\nLon: ${lon}\nAkurasi: ~${accuracy}m\nMaps: https://maps.google.com/?q=${lat},${lon}`;
      
      await transmitEncryptedText(gpsMessage);
    }, (err) => {
      alert("Akses lokasi GPS ditolak.");
    }, { enableHighAccuracy: true });
  }

  async function toggleRecording() {
    const btn = document.getElementById("btn-vn");
    if (!mediaRecorder || mediaRecorder.state === "inactive") {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = async () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const arrayBuffer = await audioBlob.arrayBuffer();
        await processAndSendMedia(arrayBuffer, "audio/webm");
      };

      mediaRecorder.start();
      btn.innerText = "🛑 Merekam... (Klik Stop)";
      btn.style.background = "#ff3366";
      btn.style.color = "#fff";
    } else {
      mediaRecorder.stop();
      btn.innerText = "🎙️ Rekam Audio";
      btn.style.background = "transparent";
      btn.style.color = "var(--accent-orange)";
    }
  }

  async function sendMediaFile() {
    const fileInput = document.getElementById("media-file");
    if(fileInput.files.length === 0) return;
    
    const file = fileInput.files[0];
    const arrayBuffer = await file.arrayBuffer();
    await processAndSendMedia(arrayBuffer, file.type);
    fileInput.value = "";
  }

  async function processAndSendMedia(arrayBuffer, mimeType) {
    if(!peerPublicKey) return alert("Public Key belum tersedia. Hubungkan chat dulu!");
    
    logSystem("Mengenkripsi media via AES-GCM 256-bit...");
    
    const aesKey = await generateAesKey();
    const iv = window.crypto.getRandomValues(new Uint8Array(12));

    const encryptedContent = await window.crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, aesKey, arrayBuffer);
    
    const rawAesKey = await window.crypto.subtle.exportKey("raw", aesKey);
    const encryptedAesKey = await window.crypto.subtle.encrypt({ name: "RSA-OAEP" }, peerPublicKey, rawAesKey);

    const blob = new Blob([encryptedContent], { type: "application/octet-stream" });
    const formData = new FormData();
    formData.append("file", blob);
    formData.append("upload_preset", UPLOAD_PRESET);

    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`, { method: "POST", body: formData });
    const cloudData = await res.json();

    const targetId = document.getElementById("target-id").value.trim();
    const myId = document.getElementById("my-id").value.trim();

    ws.send(JSON.stringify({
      type: "chat_media",
      from: myId,
      to: targetId,
      mediaUrl: cloudData.secure_url,
      mimeType: mimeType,
      encryptedAesKey: btoa(String.fromCharCode(...new Uint8Array(encryptedAesKey))),
      iv: btoa(String.fromCharCode(...new Uint8Array(iv)))
    }));

    const localUrl = URL.createObjectURL(new Blob([arrayBuffer], { type: mimeType }));
    renderMediaElement("Saya", localUrl, mimeType, "out");
  }

  async function handleReceivedMedia(data) {
    logSystem("Mendeskripsi media masuk...");

    const encryptedAesKeyBin = Uint8Array.from(atob(data.encryptedAesKey), c => c.charCodeAt(0));
    const rawAesKey = await window.crypto.subtle.decrypt({ name: "RSA-OAEP" }, keyPair.privateKey, encryptedAesKeyBin);
    const aesKey = await window.crypto.subtle.importKey("raw", rawAesKey, "AES-GCM", true, ["decrypt"]);

    const response = await fetch(data.mediaUrl);
    const encryptedBuffer = await response.arrayBuffer();

    const ivBin = Uint8Array.from(atob(data.iv), c => c.charCodeAt(0));
    const decryptedBuffer = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv: ivBin }, aesKey, encryptedBuffer);

    const localUrl = URL.createObjectURL(new Blob([decryptedBuffer], { type: data.mimeType }));
    renderMediaElement(data.from, localUrl, data.mimeType, "in");
  }

  async function decryptRSA(ciphertextBase64) {
    const binary = Uint8Array.from(atob(ciphertextBase64), c => c.charCodeAt(0));
    const decrypted = await window.crypto.subtle.decrypt({ name: "RSA-OAEP" }, keyPair.privateKey, binary);
    return new TextDecoder().decode(decrypted);
  }

  function appendMsg(sender, text, type) {
    const box = document.getElementById("chat-box");
    const formattedText = text.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" class="map-link">$1</a>');
    box.innerHTML += `
      <div class="msg ${type}">
        <div class="msg-sender">${sender}</div>
        <div>${formattedText}</div>
      </div>`;
    box.scrollTop = box.scrollHeight;
    saveChatToLocal();
  }

  function renderMediaElement(sender, blobUrl, mimeType, type) {
    const box = document.getElementById("chat-box");
    let mediaHtml = "";

    if (mimeType.startsWith("image/")) {
      mediaHtml = `<img src="${blobUrl}" class="media-preview">`;
    } else if (mimeType.startsWith("video/")) {
      mediaHtml = `<video src="${blobUrl}" controls class="media-preview"></video>`;
    } else if (mimeType.startsWith("audio/")) {
      mediaHtml = `<audio src="${blobUrl}" controls style="width:100%; margin-top:6px;"></audio>`;
    }

    box.innerHTML += `
      <div class="msg ${type}">
        <div class="msg-sender">${sender}</div>
        ${mediaHtml}
      </div>`;
    box.scrollTop = box.scrollHeight;
    saveChatToLocal();
  }

  function logSystem(text) {
    const box = document.getElementById("chat-box");
    box.innerHTML += `<div class="system">[Log]: ${text}</div>`;
    saveChatToLocal();
  }
</script>

</body>
</html>
