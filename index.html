<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CyberCrypt - Quantum Encrypted Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ffa3;
            --neon-cyan: #00f0ff;
            --neon-dim: rgba(0, 255, 163, 0.15);
            --bg-dark: #030712;
            --card-bg: rgba(15, 23, 42, 0.85);
            --border-color: rgba(0, 255, 163, 0.25);
            --text-main: #f1f5f9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
        }

        body {
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 50% 100%, rgba(0, 255, 163, 0.08) 0%, transparent 60%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 20px 20px, 20px 20px;
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Container Utama */
        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100dvh;
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            box-shadow: 0 0 50px rgba(0, 255, 163, 0.1);
            position: relative;
        }

        @media (min-width: 481px) {
            .app-container {
                height: 92vh;
                border-radius: 20px;
                border: 1px solid var(--border-color);
            }
        }

        /* Header Header */
        .header {
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            font-family: 'JetBrains Mono', monospace;
            z-index: 10;
        }

        .brand {
            color: var(--neon-cyan);
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .status-tag {
            font-size: 0.68rem;
            color: var(--neon-green);
            background: var(--neon-dim);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 163, 0.4);
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-green);
            animation: pulse-dot 1.5s infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.8); }
        }

        /* Panel Setup Login ID */
        .setup-panel {
            padding: 20px;
            background: rgba(3, 7, 18, 0.95);
            display: flex;
            flex-direction: column;
            gap: 14px;
            font-family: 'JetBrains Mono', monospace;
            flex: 1;
            justify-content: center;
        }

        .input-group label {
            font-size: 0.72rem;
            color: var(--neon-cyan);
            display: block;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .setup-panel input {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(15, 23, 42, 0.8);
            color: var(--neon-green);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .setup-panel input:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 15px rgba(0, 255, 163, 0.25);
        }

        .btn-cyber {
            padding: 14px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-green));
            color: #030712;
            border: none;
            border-radius: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: 1px;
            margin-top: 8px;
            font-size: 0.9rem;
        }

        .btn-cyber:active { transform: scale(0.98); }

        /* Area Obrolan Chat */
        .chat-box {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(3, 7, 18, 0.4);
            scroll-behavior: smooth;
        }

        .msg {
            padding: 10px 32px 10px 14px;
            border-radius: 16px;
            max-width: 85%;
            font-size: 0.88rem;
            line-height: 1.45;
            word-break: break-word;
            position: relative;
            animation: slideUp 0.2s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .sent {
            background: linear-gradient(135deg, rgba(0, 255, 163, 0.18), rgba(0, 240, 255, 0.12));
            border: 1px solid var(--border-color);
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .received {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        /* Tombol Hapus Pesan (✕) */
        .btn-delete {
            position: absolute;
            top: 6px;
            right: 8px;
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.35);
            font-size: 0.85rem;
            cursor: pointer;
            padding: 2px 4px;
            line-height: 1;
            border-radius: 50%;
            transition: all 0.2s ease;
        }

        .msg:hover .btn-delete,
        .btn-delete:active {
            color: #ef4444;
            background: rgba(239, 68, 68, 0.15);
        }

        .msg img, .msg video {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 6px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: block;
        }

        /* Toolbar Input Chat & Media */
        .input-bar-container {
            padding: 10px 12px;
            background: rgba(15, 23, 42, 0.95);
            border-top: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .media-actions {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 2px;
        }

        .media-actions::-webkit-scrollbar { display: none; }

        .btn-action {
            background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(0, 240, 255, 0.25);
            color: var(--neon-cyan);
            min-width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .btn-action:active {
            background: rgba(0, 240, 255, 0.2);
            transform: scale(0.92);
        }

        .text-input-row {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .text-input-row input[type="text"] {
            flex: 1;
            padding: 10px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(3, 7, 18, 0.9);
            color: #f8fafc;
            font-size: 0.88rem;
            outline: none;
        }

        .text-input-row input[type="text"]:focus {
            border-color: var(--neon-cyan);
        }

        .btn-send {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-green));
            color: #030712;
            border: none;
            padding: 0 16px;
            height: 38px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            flex-shrink: 0;
        }

        .recording {
            background: rgba(239, 68, 68, 0.25) !important;
            color: #ef4444 !important;
            border-color: #ef4444 !important;
            animation: pulse-red 1s infinite;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
            70% { box-shadow: 0 0 0 8px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="brand">
            <span style="color:var(--neon-green);">&gt;_</span> CYBERCRYPT
        </div>
        <div id="syncStatus" class="status-tag">
            <div class="status-dot"></div>
            <span>ONLINE</span>
        </div>
    </div>

    <!-- Panel Setup ID -->
    <div class="setup-panel" id="setupArea">
        <div class="input-group">
            <label>// YOUR_NODE_ID</label>
            <input type="text" id="myId" placeholder="misal: alpha_node">
        </div>
        <div class="input-group">
            <label>// TARGET_NODE_ID</label>
            <input type="text" id="targetId" placeholder="misal: beta_node">
        </div>
        <button class="btn-cyber" onclick="startChat()">[CONNECT_TERMINAL]</button>
    </div>

    <!-- Area Obrolan -->
    <div class="chat-box" id="chatBox"></div>

    <!-- Input Bar Mobile -->
    <div class="input-bar-container" id="inputArea" style="display: none;">
        <div class="media-actions">
            <label class="btn-action" title="Ambil Foto">
                📸
                <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;" onchange="uploadMedia(this.files[0])">
            </label>

            <label class="btn-action" title="Buka Galeri">
                📁
                <input type="file" id="fileInput" accept="image/*,video/*" style="display: none;" onchange="uploadMedia(this.files[0])">
            </label>
            
            <button class="btn-action" title="Kirim Lokasi" onclick="shareLocation()">📍</button>
            <button class="btn-action" id="vnBtn" title="Voice Note" onclick="toggleVN()">🎙️</button>
        </div>

        <div class="text-input-row">
            <input type="text" id="textInput" placeholder="Pesan rahasia..." onkeydown="if(event.key==='Enter') sendText()">
            <button class="btn-send" onclick="sendText()">SEND</button>
        </div>
    </div>
</div>

<script>
    // ====================================================================
    // ⚠️ PASTIKAN DOMAIN RAILWAY ANDA TERTANAM DI SINI (DENGAN https://)
    const RAILWAY_URL = "https://chat-e2ee-backend-production.up.railway.app";
    // ====================================================================

    let MY_ID = "";
    let TARGET_ID = "";
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    function startChat() {
        MY_ID = document.getElementById("myId").value.trim();
        TARGET_ID = document.getElementById("targetId").value.trim();

        if (!MY_ID || !TARGET_ID) {
            alert("Isi ID Anda dan ID Tujuan!");
            return;
        }

        if (RAILWAY_URL.includes("GANTI_DENGAN_DOMAIN")) {
            alert("Buka file index.html dan ganti variabel RAILWAY_URL!");
            return;
        }

        document.getElementById("setupArea").style.display = "none";
        document.getElementById("inputArea").style.display = "flex";
        
        loadMessages();
        setInterval(loadMessages, 3000);
    }

    async function loadMessages() {
        try {
            const cleanUrl = RAILWAY_URL.replace(/\/$/, "");
            const res = await fetch(`${cleanUrl}/messages/${MY_ID}/${TARGET_ID}`);
            const data = await res.json();
            const box = document.getElementById("chatBox");
            box.innerHTML = "";

            data.forEach(msg => {
                const isMe = msg.sender_id === MY_ID;
                const div = document.createElement("div");
                div.className = `msg ${isMe ? 'sent' : 'received'}`;

                let contentHtml = "";
                if (msg.msg_type === 'text') {
                    contentHtml = msg.content;
                } else if (msg.msg_type === 'image') {
                    contentHtml = `<img src="${cleanUrl}${msg.content}">`;
                } else if (msg.msg_type === 'video') {
                    contentHtml = `<video src="${cleanUrl}${msg.content}" controls></video>`;
                } else if (msg.msg_type === 'audio') {
                    contentHtml = `<audio src="${cleanUrl}${msg.content}" controls style="max-width:200px;"></audio>`;
                } else if (msg.msg_type === 'location') {
                    const [lat, lon] = msg.content.split(",");
                    contentHtml = `📍 <a href="https://www.google.com/maps?q=${lat},${lon}" target="_blank" style="color:var(--neon-green); text-decoration: underline;">Buka Lokasi GPS</a>`;
                }

                // Menyusun isi pesan beserta tombol hapus (✕)
                div.innerHTML = `
                    ${contentHtml}
                    <button class="btn-delete" title="Hapus Pesan" onclick="deleteMessage(${msg.id})">✕</button>
                `;

                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
            document.getElementById("syncStatus").innerHTML = `<div class="status-dot"></div><span>ONLINE</span>`;
            document.getElementById("syncStatus").style.color = "var(--neon-green)";
        } catch (e) {
            document.getElementById("syncStatus").innerHTML = `<span>🔴 ERR_SYNC</span>`;
            document.getElementById("syncStatus").style.color = "#ef4444";
        }
    }

    // Fungsi untuk Menghapus Pesan dari Server FastAPI
    async function deleteMessage(msgId) {
        if (!confirm("Hapus pesan ini?")) return;
        
        try {
            const cleanUrl = RAILWAY_URL.replace(/\/$/, "");
            const res = await fetch(`${cleanUrl}/messages/${msgId}`, {
                method: "DELETE"
            });
            if (res.ok) {
                loadMessages();
            } else {
                alert("Gagal menghapus pesan.");
            }
        } catch (e) {
            alert("Terjadi kesalahan koneksi saat menghapus pesan.");
        }
    }

    async function sendPayload(type, content) {
        const cleanUrl = RAILWAY_URL.replace(/\/$/, "");
        await fetch(`${cleanUrl}/messages`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sender_id: MY_ID, receiver_id: TARGET_ID, msg_type: type, content: content })
        });
        loadMessages();
    }

    function sendText() {
        const input = document.getElementById("textInput");
        if (input.value.trim()) {
            sendPayload("text", input.value.trim());
            input.value = "";
        }
    }

    async function uploadMedia(file) {
        if (!file) return;
        const cleanUrl = RAILWAY_URL.replace(/\/$/, "");
        const formData = new FormData();
        formData.append("file", file);

        const res = await fetch(`${cleanUrl}/upload`, { method: "POST", body: formData });
        const data = await res.json();
        const type = file.type.startsWith("video/") ? "video" : file.type.startsWith("audio/") ? "audio" : "image";
        sendPayload(type, data.url);
    }

    function shareLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                const coords = `${pos.coords.latitude},${pos.coords.longitude}`;
                sendPayload("location", coords);
            }, () => alert("Gagal mengambil lokasi. Pastikan izin lokasi aktif!"));
        }
    }

    async function toggleVN() {
        const vnBtn = document.getElementById("vnBtn");
        if (!isRecording) {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = async () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                const file = new File([blob], "vn.webm", { type: "audio/webm" });
                uploadMedia(file);
            };
            mediaRecorder.start();
            isRecording = true;
            vnBtn.classList.add("recording");
        } else {
            mediaRecorder.stop();
            isRecording = false;
            vnBtn.classList.remove("recording");
        }
    }
</script>

</body>
</html>
