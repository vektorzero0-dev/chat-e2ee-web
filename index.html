<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER_CRYPT // E2EE TERMINAL</title>
  <style>
    :root {
      --bg-color: #05080a;
      --panel-bg: #0d131a;
      --accent-green: #00ff66;
      --accent-dim: #008f39;
      --accent-red: #ff3366;
      --accent-orange: #ff9900;
      --text-main: #00ff66;
      --text-muted: #4e7060;
      --border-color: #1a2921;
    }

    body { 
      font-family: 'Consolas', 'Courier New', monospace; 
      background: var(--bg-color); 
      color: var(--text-main); 
      margin: 0; 
      padding: 15px; 
      text-shadow: 0 0 2px rgba(0, 255, 102, 0.4);
    }

    .card { 
      max-width: 480px; 
      margin: 0 auto; 
      background: var(--panel-bg); 
      padding: 20px; 
      border-radius: 6px; 
      border: 1px solid var(--accent-green); 
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.15); 
    }

    h3 {
      margin-top: 0;
      color: var(--accent-green);
      letter-spacing: 2px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    input, button { 
      width: 100%; 
      padding: 12px; 
      margin: 6px 0; 
      border-radius: 4px; 
      border: 1px solid var(--border-color); 
      background: #080d12; 
      color: var(--accent-green); 
      font-family: inherit;
      box-sizing: border-box; 
      transition: all 0.3s ease;
    }

    input:focus {
      outline: none;
      border-color: var(--accent-green);
      box-shadow: 0 0 8px rgba(0, 255, 102, 0.4);
    }

    button { 
      background: rgba(0, 255, 102, 0.1); 
      font-weight: bold; 
      cursor: pointer; 
      border: 1px solid var(--accent-green); 
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    button:hover { 
      background: var(--accent-green); 
      color: #000; 
      box-shadow: 0 0 12px var(--accent-green);
    }

    #chat-box { 
      height: 320px; 
      border: 1px solid var(--border-color); 
      overflow-y: auto; 
      padding: 10px; 
      margin: 12px 0; 
      border-radius: 4px; 
      background: #020406; 
      display: flex; 
      flex-direction: column; 
    }

    .msg { 
      margin: 6px 0; 
      padding: 8px 12px; 
      border-radius: 4px; 
      max-width: 85%; 
      word-break: break-word; 
      font-size: 0.85em; 
      line-height: 1.4;
    }

    .system { 
      color: var(--text-muted); 
      text-align: center; 
      font-size: 0.75em; 
      margin: 4px 0; 
    }

    .in { 
      background: #0e1a14; 
      border-left: 3px solid var(--accent-green); 
      align-self: flex-start; 
    }

    .out { 
      background: #1a1600; 
      border-right: 3px solid var(--accent-orange); 
      color: #ffcc00;
      margin-left: auto; 
      text-align: right; 
    }

    .media-preview { 
      max-width: 100%; 
      border-radius: 4px; 
      margin-top: 5px; 
      border: 1px solid var(--border-color);
    }

    hr { border: 0; border-top: 1px solid var(--border-color); margin: 12px 0; }
  </style>
</head>
<body>

<div class="card">
  <h3>⚡ CYBER_CRYPT // E2EE</h3>
  <div id="status" class="system">[SYS_INIT]: GEN_RSA_KEYPAIR...</div>
  
  <input type="text" id="my-id" placeholder="> IDENTITY-HASH (ex: node_alpha)">
  <input type="text" id="target-id" placeholder="> NODE-TARGET (ex: node_bravo)">
  <button onclick="connectWS()">[+] ESTABLISH SECURE LINK</button>

  <div id="chat-box"></div>

  <input type="text" id="message-input" placeholder="> Type encrypted payload...">
  <button onclick="sendTextMessage()">[>] TRANSMIT PAYLOAD</button>
  
  <hr>

  <label style="font-size: 0.75em; color: var(--text-muted);">[MEDIA ENCRYPTION PROTOCOL]:</label>
  <input type="file" id="media-file" accept="image/*,video/*">
  <button onclick="sendMediaFile()" style="border-color: var(--accent-dim); color: var(--accent-dim);">[^] UPLOAD ENCRYPTED MEDIA</button>
  
  <button id="btn-vn" onclick="toggleRecording()" style="border-color: var(--accent-orange); color: var(--accent-orange); margin-top:8px;">[🎙️] RECORD AUDIO PAYLOAD</button>
  <button onclick="clearHistory()" style="border-color: var(--accent-red); color: var(--accent-red); margin-top:8px;">[x] PURGE LOCAL LOGS</button>
</div>

<script>
  const RENDER_WS_URL = "wss://chat-e2ee-backend.onrender.com/ws/"; 
  const CLOUD_NAME = "ktbbdjrb"; 
  const UPLOAD_PRESET = "chat_preset"; 

  let ws, keyPair, peerPublicKey;
  let mediaRecorder, audioChunks = [];

  window.onload = () => {
    const savedChat = localStorage.getItem("e2ee_chat_history");
    if (savedChat) {
      document.getElementById("chat-box").innerHTML = savedChat;
      const box = document.getElementById("chat-box");
      box.scrollTop = box.scrollHeight;
    }
  };

  function saveChatToLocal() {
    const boxHtml = document.getElementById("chat-box").innerHTML;
    localStorage.setItem("e2ee_chat_history", boxHtml);
  }

  function clearHistory() {
    if(confirm("[WARNING]: Purge all decrypted local logs?")) {
      localStorage.removeItem("e2ee_chat_history");
      document.getElementById("chat-box").innerHTML = "";
    }
  }

  async function initKeys() {
    keyPair = await window.crypto.subtle.generateKey(
      { name: "RSA-OAEP", modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: "SHA-256" },
      true, ["encrypt", "decrypt"]
    );
    document.getElementById("status").innerText = "[SYS_READY]: 2048-BIT RSA READY";
  }
  initKeys();

  async function exportPublicKey() {
    const exported = await window.crypto.subtle.exportKey("spki", keyPair.publicKey);
    return btoa(String.fromCharCode(...new Uint8Array(exported)));
  }

  async function importPublicKey(pemBase64) {
    const binaryDer = Uint8Array.from(atob(pemBase64), c => c.charCodeAt(0));
    return await window.crypto.subtle.importKey(
      "spki", binaryDer, { name: "RSA-OAEP", hash: "SHA-256" }, true, ["encrypt"]
    );
  }

  async function generateAesKey() {
    return await window.crypto.subtle.generateKey(
      { name: "AES-GCM", length: 256 }, true, ["encrypt", "decrypt"]
    );
  }

  async function connectWS() {
    const myId = document.getElementById("my-id").value.trim();
    const targetId = document.getElementById("target-id").value.trim();
    if(!myId || !targetId) return alert("[ERROR]: Identity and Target required!");

    document.getElementById("status").innerText = "[NET_CONNECT]: Handshaking Server...";
    ws = new WebSocket(RENDER_WS_URL + myId);

    ws.onopen = async () => {
      document.getElementById("status").innerText = "[KEY_EXCHANGE]: Transmitting Public Key...";
      const pubKeyStr = await exportPublicKey();
      ws.send(JSON.stringify({ type: "key_exchange", from: myId, to: targetId, key: pubKeyStr }));
    };

    ws.onerror = (error) => {
      document.getElementById("status").innerText = "[ERR]: Connection Refused!";
      alert("[ERR_NET]: Failed to establish WebSocket tunnel.");
    };

    ws.onmessage = async (event) => {
      const data = JSON.parse(event.data);

      if(data.type === "key_exchange") {
        peerPublicKey = await importPublicKey(data.key);
        logSystem(`PUBKEY_ACK from [${data.from}]`);
        const pubKeyStr = await exportPublicKey();
        ws.send(JSON.stringify({ type: "key_ack", from: myId, to: data.from, key: pubKeyStr }));
      } 
      else if(data.type === "key_ack") {
        peerPublicKey = await importPublicKey(data.key);
        document.getElementById("status").innerText = "[SECURE_LINK_ACTIVE]: E2EE ONLINE";
        logSystem("CHANNEL ENCRYPTED // LINK ESTABLISHED");
      }
      else if(data.type === "chat_text") {
        const text = await decryptRSA(data.ciphertext);
        appendMsg(data.from, text, "in");
      }
      else if(data.type === "chat_media") {
        await handleReceivedMedia(data);
      }
    };
  }

  async function sendTextMessage() {
    const text = document.getElementById("message-input").value;
    const targetId = document.getElementById("target-id").value.trim();
    const myId = document.getElementById("my-id").value.trim();

    if(!peerPublicKey) return alert("[ERR]: Peer public key missing! Establish link first.");

    const enc = new TextEncoder();
    const encrypted = await window.crypto.subtle.encrypt({ name: "RSA-OAEP" }, peerPublicKey, enc.encode(text));
    const ciphertextBase64 = btoa(String.fromCharCode(...new Uint8Array(encrypted)));

    ws.send(JSON.stringify({ type: "chat_text", from: myId, to: targetId, ciphertext: ciphertextBase64 }));
    appendMsg("LOCAL_NODE", text, "out");
    document.getElementById("message-input").value = "";
  }

  async function sendMediaFile() {
    const fileInput = document.getElementById("media-file");
    if(fileInput.files.length === 0) return alert("[ERR]: No payload selected!");
    
    const file = fileInput.files[0];
    const arrayBuffer = await file.arrayBuffer();
    await processAndSendMedia(arrayBuffer, file.type);
    fileInput.value = "";
  }

  async function toggleRecording() {
    const btn = document.getElementById("btn-vn");
    if (!mediaRecorder || mediaRecorder.state === "inactive") {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = async () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const arrayBuffer = await audioBlob.arrayBuffer();
        await processAndSendMedia(arrayBuffer, "audio/webm");
      };

      mediaRecorder.start();
      btn.innerText = "[🛑] RECORDING... CLICK TO TRANSMIT";
      btn.style.background = "#ff3366";
      btn.style.color = "#fff";
    } else {
      mediaRecorder.stop();
      btn.innerText = "[🎙️] RECORD AUDIO PAYLOAD";
      btn.style.background = "transparent";
      btn.style.color = "var(--accent-orange)";
    }
  }

  async function processAndSendMedia(arrayBuffer, mimeType) {
    logSystem("[ENC_PAYLOAD]: Encrypting with AES-GCM-256...");
    
    const aesKey = await generateAesKey();
    const iv = window.crypto.getRandomValues(new Uint8Array(12));

    const encryptedContent = await window.crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, aesKey, arrayBuffer);
    
    const rawAesKey = await window.crypto.subtle.exportKey("raw", aesKey);
    const encryptedAesKey = await window.crypto.subtle.encrypt({ name: "RSA-OAEP" }, peerPublicKey, rawAesKey);

    const blob = new Blob([encryptedContent], { type: "application/octet-stream" });
    const formData = new FormData();
    formData.append("file", blob);
    formData.append("upload_preset", UPLOAD_PRESET);

    const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/auto/upload`, { method: "POST", body: formData });
    const cloudData = await res.json();

    const targetId = document.getElementById("target-id").value.trim();
    const myId = document.getElementById("my-id").value.trim();

    ws.send(JSON.stringify({
      type: "chat_media",
      from: myId,
      to: targetId,
      mediaUrl: cloudData.secure_url,
      mimeType: mimeType,
      encryptedAesKey: btoa(String.fromCharCode(...new Uint8Array(encryptedAesKey))),
      iv: btoa(String.fromCharCode(...new Uint8Array(iv)))
    }));

    const localUrl = URL.createObjectURL(new Blob([arrayBuffer], { type: mimeType }));
    renderMediaElement("LOCAL_NODE", localUrl, mimeType, "out");
  }

  async function handleReceivedMedia(data) {
    logSystem("[DEC_PAYLOAD]: Decrypting incoming media buffer...");

    const encryptedAesKeyBin = Uint8Array.from(atob(data.encryptedAesKey), c => c.charCodeAt(0));
    const rawAesKey = await window.crypto.subtle.decrypt({ name: "RSA-OAEP" }, keyPair.privateKey, encryptedAesKeyBin);
    const aesKey = await window.crypto.subtle.importKey("raw", rawAesKey, "AES-GCM", true, ["decrypt"]);

    const response = await fetch(data.mediaUrl);
    const encryptedBuffer = await response.arrayBuffer();

    const ivBin = Uint8Array.from(atob(data.iv), c => c.charCodeAt(0));
    const decryptedBuffer = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv: ivBin }, aesKey, encryptedBuffer);

    const localUrl = URL.createObjectURL(new Blob([decryptedBuffer], { type: data.mimeType }));
    renderMediaElement(data.from, localUrl, data.mimeType, "in");
  }

  async function decryptRSA(ciphertextBase64) {
    const binary = Uint8Array.from(atob(ciphertextBase64), c => c.charCodeAt(0));
    const decrypted = await window.crypto.subtle.decrypt({ name: "RSA-OAEP" }, keyPair.privateKey, binary);
    return new TextDecoder().decode(decrypted);
  }

  function appendMsg(sender, text, type) {
    const box = document.getElementById("chat-box");
    box.innerHTML += `<div class="msg ${type}"><b>&lt;${sender}&gt;:</b> ${text}</div>`;
    box.scrollTop = box.scrollHeight;
    saveChatToLocal();
  }

  function renderMediaElement(sender, blobUrl, mimeType, type) {
    const box = document.getElementById("chat-box");
    let mediaHtml = "";

    if (mimeType.startsWith("image/")) {
      mediaHtml = `<img src="${blobUrl}" class="media-preview">`;
    } else if (mimeType.startsWith("video/")) {
      mediaHtml = `<video src="${blobUrl}" controls class="media-preview"></video>`;
    } else if (mimeType.startsWith("audio/")) {
      mediaHtml = `<audio src="${blobUrl}" controls style="width:100%; margin-top:5px;"></audio>`;
    }

    box.innerHTML += `<div class="msg ${type}"><b>&lt;${sender}&gt;:</b><br>${mediaHtml}</div>`;
    box.scrollTop = box.scrollHeight;
    saveChatToLocal();
  }

  function logSystem(text) {
    const box = document.getElementById("chat-box");
    box.innerHTML += `<div class="system">[LOG]: ${text}</div>`;
    saveChatToLocal();
  }
</script>

</body>
</html>
