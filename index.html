<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberCrypt - E2EE Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 24px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 12px; }
        .title { font-size: 1.2rem; font-weight: bold; color: #38bdf8; }
        .status { font-size: 0.85rem; font-weight: 600; padding: 4px 10px; border-radius: 20px; background-color: #334155; }
        .status.online { color: #4ade80; }
        .status.offline { color: #f87171; }
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 6px; }
        input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background-color: #0f172a; color: #fff; font-size: 0.9rem; }
        input:focus { outline: none; border-color: #38bdf8; }
        button { width: 100%; padding: 12px; border-radius: 6px; border: none; background-color: #0284c7; color: white; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background-color: #0369a1; }
        .chat-box { height: 250px; border: 1px solid #334155; border-radius: 6px; background-color: #0f172a; padding: 12px; overflow-y: auto; margin-bottom: 12px; display: flex; flex-direction: column; gap: 8px; }
        .message { padding: 8px 12px; border-radius: 6px; max-width: 80%; font-size: 0.85rem; word-break: break-word; }
        .message.sent { background-color: #0369a1; align-self: flex-end; }
        .message.received { background-color: #334155; align-self: flex-start; }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <div class="title">🔒 CyberCrypt</div>
        <div id="statusText" class="status offline">🔴 Terputus</div>
    </div>

    <div id="setupArea">
        <div class="form-group">
            <label>ID / Domain Backend Railway</label>
            <input type="text" id="railwayUrl" placeholder="chat-backend-production-xxxx.up.railway.app">
        </div>
        <div class="form-group">
            <label>ID Room Chat</label>
            <input type="text" id="roomId" placeholder="Contoh: room123">
        </div>
        <button onclick="connectWS()">Hubungkan Chat</button>
    </div>

    <div id="chatArea" style="display: none;">
        <div class="chat-box" id="chatBox"></div>
        <div class="form-group" style="display: flex; gap: 8px;">
            <input type="text" id="msgInput" placeholder="Tulis pesan..." onkeydown="if(event.key==='Enter') sendMsg()">
            <button onclick="sendMsg()" style="width: auto; padding: 0 16px;">Kirim</button>
        </div>
    </div>
</div>

<script>
    let ws = null;

    function connectWS() {
        let domain = document.getElementById("railwayUrl").value.trim();
        const roomId = document.getElementById("roomId").value.trim();

        if (!domain || !roomId) {
            alert("Harap isi URL Railway dan Room ID!");
            return;
        }

        // Bersihkan awalan http:// atau https:// jika terikut ter-copy
        domain = domain.replace(/^https?:\/\//, '').replace(/\/$/, '');

        // Format WebSocket Secure (wss://)
        const wsUrl = `wss://${domain}/ws/${roomId}`;

        ws = new WebSocket(wsUrl);

        ws.onopen = () => {
            document.getElementById("statusText").innerHTML = "🟢 Terhubung";
            document.getElementById("statusText").className = "status online";
            document.getElementById("setupArea").style.display = "none";
            document.getElementById("chatArea").style.display = "block";
        };

        ws.onmessage = (event) => {
            addMessage(event.data, 'received');
        };

        ws.onclose = () => {
            document.getElementById("statusText").innerHTML = "🔴 Terputus";
            document.getElementById("statusText").className = "status offline";
            document.getElementById("setupArea").style.display = "block";
            document.getElementById("chatArea").style.display = "none";
        };

        ws.onerror = (err) => {
            alert("Gagal terhubung ke server Railway. Periksa kembali URL Domain Anda.");
            console.error(err);
        };
    }

    function sendMsg() {
        const input = document.getElementById("msgInput");
        const msg = input.value.trim();
        if (msg && ws) {
            ws.send(msg);
            addMessage(msg, 'sent');
            input.value = "";
        }
    }

    function addMessage(text, type) {
        const box = document.getElementById("chatBox");
        const div = document.createElement("div");
        div.className = `message ${type}`;
        div.textContent = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }
</script>

</body>
</html>
