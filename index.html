<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberCrypt - Quantum Encrypted Terminal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ffa3;
            --neon-cyan: #00f0ff;
            --bg-dark: #030712;
            --card-bg: rgba(15, 23, 42, 0.75);
            --border-color: rgba(0, 255, 163, 0.25);
            --text-main: #f1f5f9;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 85%, rgba(0, 255, 163, 0.08) 0%, transparent 40%),
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
            overflow: hidden;
        }

        /* Overlay Scanline Futuristik */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 100;
            pointer-events: none;
            opacity: 0.6;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            height: 94vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 0 40px rgba(0, 255, 163, 0.15), inset 0 0 15px rgba(0, 240, 255, 0.05);
            position: relative;
            z-index: 10;
        }

        /* Header Terminal */
        .header {
            padding: 16px 20px;
            background: rgba(30, 41, 59, 0.6);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            font-family: 'JetBrains Mono', monospace;
        }

        .brand {
            color: var(--neon-cyan);
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-tag {
            font-size: 0.72rem;
            color: var(--neon-green);
            background: rgba(0, 255, 163, 0.1);
            padding: 5px 12px;
            border-radius: 20px;
            border: 1px solid rgba(0, 255, 163, 0.4);
            font-weight: 600;
            letter-spacing: 0.5px;
            box-shadow: 0 0 10px rgba(0, 255, 163, 0.2);
        }

        /* Panel Setup/Login ID */
        .setup-panel {
            padding: 24px;
            background: rgba(15, 23, 42, 0.8);
            display: flex;
            flex-direction: column;
            gap: 16px;
            font-family: 'JetBrains Mono', monospace;
        }

        .input-group label {
            font-size: 0.75rem;
            color: var(--neon-cyan);
            display: block;
            margin-bottom: 6px;
            letter-spacing: 1px;
        }

        .setup-panel input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(3, 7, 18, 0.8);
            color: var(--neon-green);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .setup-panel input:focus {
            border-color: var(--neon-green);
            box-shadow: 0 0 15px rgba(0, 255, 163, 0.3);
        }

        .btn-cyber {
            padding: 14px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-green));
            color: #030712;
            border: none;
            border-radius: 10px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 1.5px;
            margin-top: 8px;
            text-shadow: 0 0 2px rgba(255,255,255,0.5);
        }

        .btn-cyber:hover {
            box-shadow: 0 0 25px rgba(0, 255, 163, 0.6);
            transform: translateY(-2px);
        }

        /* Area Obrolan Chat */
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 14px;
            background: rgba(3, 7, 18, 0.4);
        }

        .chat-box::-webkit-scrollbar { width: 4px; }
        .chat-box::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }

        .msg {
            padding: 12px 16px;
            border-radius: 16px;
            max-width: 80%;
            font-size: 0.93rem;
            line-height: 1.5;
            word-break: break-word;
            position: relative;
            animation: fadeIn 0.25s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .sent {
            background: linear-gradient(135deg, rgba(0, 255, 163, 0.15), rgba(0, 240, 255, 0.1));
            border: 1px solid var(--border-color);
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .received {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .msg img, .msg video {
            max-width: 100%;
            border-radius: 10px;
            margin-top: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Toolbar Input Chat & Media */
        .input-bar {
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            gap: 10px;
            align-items: center;
            border-top: 1px solid var(--border-color);
        }

        .input-bar input[type="text"] {
            flex: 1;
            padding: 12px 18px;
            border-radius: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(3, 7, 18, 0.9);
            color: #f8fafc;
            font-size: 0.92rem;
            outline: none;
            transition: all 0.3s;
        }

        .input-bar input[type="text"]:focus {
            border-color: var(--neon-cyan);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
        }

        .btn-action {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--neon-cyan);
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .btn-action:hover {
            background: rgba(0, 240, 255, 0.15);
            border-color: var(--neon-cyan);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
            transform: scale(1.05);
        }

        .btn-send {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-green));
            color: #030712;
            border: none;
            padding: 0 18px;
            height: 42px;
            border-radius: 22px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
            transition: all 0.3s ease;
        }

        .btn-send:hover {
            box-shadow: 0 0 15px rgba(0, 255, 163, 0.5);
            transform: scale(1.03);
        }

        .recording {
            background: rgba(239, 68, 68, 0.2) !important;
            color: #ef4444 !important;
            border-color: #ef4444 !important;
            animation: pulse-red 1s infinite;
        }

        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <div class="brand">
            <span style="color:var(--neon-green);">&gt;</span> CYBERCRYPT_
        </div>
        <div id="syncStatus" class="status-tag">● QUANTUM_LINKED</div>
    </div>

    <!-- Panel Login ID -->
    <div class="setup-panel" id="setupArea">
        <div class="input-group">
            <label>// YOUR_NODE_ID</label>
            <input type="text" id="myId" placeholder="misal: alpha_node">
        </div>
        <div class="input-group">
            <label>// TARGET_NODE_ID</label>
            <input type="text" id="targetId" placeholder="misal: beta_node">
        </div>
        <button class="btn-cyber" onclick="startChat()">[INITIALIZE_SESSION]</button>
    </div>

    <!-- Container Chat -->
    <div class="chat-box" id="chatBox"></div>

    <!-- Toolbar Input & Media -->
    <div class="input-bar" id="inputArea" style="display: none;">
        <label class="btn-action" title="Buka Kamera">
            📸
            <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;" onchange="uploadMedia(this.files[0])">
        </label>

        <label class="btn-action" title="Upload Galeri">
            📁
            <input type="file" id="fileInput" accept="image/*,video/*" style="display: none;" onchange="uploadMedia(this.files[0])">
        </label>
        
        <button class="btn-action" title="Kirim Lokasi" onclick="shareLocation()">📍</button>
        <button class="btn-action" id="vnBtn" title="Rekam Suara (VN)" onclick="toggleVN()">🎙️</button>

        <input type="text" id="textInput" placeholder="Ketik pesan rahasia..." onkeydown="if(event.key==='Enter') sendText()">
        <button class="btn-send" onclick="sendText()">SEND</button>
    </div>
</div>

<script>
    // ====================================================================
    // ⚠️ PASTIKAN DOMAIN RAILWAY ANDA TERTANAM DI SINI (DENGAN https://)
    const RAILWAY_URL = "https://chat-e2ee-backend-production.up.railway.app";
    // ====================================================================

    let MY_ID = "";
    let TARGET_ID = "";
    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    function startChat() {
        MY_ID = document.getElementById("myId").value.trim();
        TARGET_ID = document.getElementById("targetId").value.trim();

        if (!MY_ID || !TARGET_ID) {
            alert("Isi ID Anda dan ID Tujuan!");
            return;
        }

        if (RAILWAY_URL.includes("GANTI_DENGAN_DOMAIN")) {
            alert("Buka file index.html dan ganti variabel RAILWAY_URL di baris 214!");
            return;
        }

        document.getElementById("setupArea").style.display = "none";
        document.getElementById("inputArea").style.display = "flex";
        
        loadMessages();
        setInterval(loadMessages, 3000);
    }

    async function loadMessages() {
        try {
            const cleanUrl = RAILWAY_URL.replace(/\/$/, "");
            const res = await fetch(`${cleanUrl}/messages/${MY_ID}/${TARGET_ID}`);
            const data = await res.json();
            const box = document.getElementById("chatBox");
            box.innerHTML = "";

            data.forEach(msg => {
                const isMe = msg.sender_id === MY_ID;
                const div = document.createElement("div");
                div.className = `msg ${isMe ? 'sent' : 'received'}`;

                if (msg.msg_type === 'text') {
                    div.innerText = msg.content;
                } else if (msg.msg_type === 'image') {
                    div.innerHTML = `<img src="${cleanUrl}${msg.content}">`;
                } else if (msg.msg_type === 'video') {
                    div.innerHTML = `<video src="${cleanUrl}${msg.content}" controls></video>`;
                } else if (msg.msg_type === 'audio') {
                    div.innerHTML = `<audio src="${cleanUrl}${msg.content}" controls></audio>`;
                } else if (msg.msg_type === 'location') {
                    const [lat, lon] = msg.content.split(",");
                    div.innerHTML = `📍 <a href="https://www.google.com/maps?q=${lat},${lon}" target="_blank" style="color:var(--neon-green); text-decoration: underline;">Buka Lokasi GPS</a>`;
                }
                box.appendChild(div);
            });
            box.scrollTop = box.scrollHeight;
            document.getElementById("syncStatus").innerText = "● QUANTUM_LINKED";
            document.getElementById("syncStatus").style.color = "var(--neon-green)";
        } catch (e) {
            document.getElementById("syncStatus").innerText = "🔴 SYNC_FAILED";
            document.getElementById("syncStatus").style.color = "#ef4444";
        }
    }

    async function sendPayload(type, content) {
        const cleanUrl = RAILWAY_URL.replace(/\/$/, "");
        await fetch(`${cleanUrl}/messages`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ sender_id: MY_ID, receiver_id: TARGET_ID, msg_type: type, content: content })
        });
        loadMessages();
    }

    function sendText() {
        const input = document.getElementById("textInput");
        if (input.value.trim()) {
            sendPayload("text", input.value.trim());
            input.value = "";
        }
    }

    async function uploadMedia(file) {
        if (!file) return;
        const cleanUrl = RAILWAY_URL.replace(/\/$/, "");
        const formData = new FormData();
        formData.append("file", file);

        const res = await fetch(`${cleanUrl}/upload`, { method: "POST", body: formData });
        const data = await res.json();
        const type = file.type.startsWith("video/") ? "video" : file.type.startsWith("audio/") ? "audio" : "image";
        sendPayload(type, data.url);
    }

    function shareLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(pos => {
                const coords = `${pos.coords.latitude},${pos.coords.longitude}`;
                sendPayload("location", coords);
            }, () => alert("Gagal mengambil lokasi. Pastikan izin lokasi aktif!"));
        }
    }

    async function toggleVN() {
        const vnBtn = document.getElementById("vnBtn");
        if (!isRecording) {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            audioChunks = [];
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = async () => {
                const blob = new Blob(audioChunks, { type: 'audio/webm' });
                const file = new File([blob], "vn.webm", { type: "audio/webm" });
                uploadMedia(file);
            };
            mediaRecorder.start();
            isRecording = true;
            vnBtn.classList.add("recording");
        } else {
            mediaRecorder.stop();
            isRecording = false;
            vnBtn.classList.remove("recording");
        }
    }
</script>

</body>
</html>
